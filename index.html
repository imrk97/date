<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffecd2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: linear-gradient(145deg, #ffffff 0%, #fff5f5 100%);
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(255, 105, 135, 0.25);
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #d6336c;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1rem;
            color: #e91e63;
            margin-bottom: 20px;
        }

        .visual-area {
            margin: 25px 0;
            height: 200px;
            background: linear-gradient(135deg, #ffe4e6 0%, #ffccd5 100%);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a80 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #ffccd5 0%, #ffb3c1 100%);
            color: #d6336c;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
        }

        .success-screen {
            display: none;
        }

        .success-screen h2 {
            font-size: 2.2rem;
            color: #d6336c;
            margin-bottom: 15px;
        }

        .success-screen p {
            font-size: 1.2rem;
            color: #e91e63;
        }

        .success-emoji {
            font-size: 5rem;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header" id="header">
            <h1>Will you go on a date with me? 🌹</h1>
            <p>I am coming to Kolkata during Durga Puja</p>
        </div>

        <div class="visual-area" id="visualArea">
            🌸💕🌸
        </div>

        <div class="buttons" id="buttons">
            <button class="btn btn-yes" onclick="showSuccess()">Yes! 💖</button>
            <button class="btn btn-no" id="noBtn">No 😢</button>
        </div>

        <div class="success-screen" id="successScreen">
            <div class="success-emoji">🥰</div>
            <h2>Yay! See you then!</h2>
            <p>I'm so excited! Can't wait! 💕</p>
        </div>
    </div>

    <script>
        function showSuccess() {
            document.getElementById('header').style.display = 'none';
            document.getElementById('visualArea').style.display = 'none';
            document.getElementById('buttons').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            
            // Create confetti
            const colors = ['#ff6b9d', '#ff8a80', '#ffb3c1', '#ffccd5', '#ffd1dc', '#ff69b4', '#ff1493', '#db7093'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 4000);
                }, i * 30);
            }
        }

        // No button dodge effect
        const noBtn = document.getElementById('noBtn');
        let dodgeCount = 0;

        function dodgeButton() {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const buttonRect = noBtn.getBoundingClientRect();
            
            const maxX = viewportWidth - buttonRect.width - 20;
            const maxY = viewportHeight - buttonRect.height - 20;
            
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.zIndex = '1000';
            
            dodgeCount++;
            
            if (dodgeCount === 3) {
                noBtn.textContent = 'Are you sure? 🥺';
            } else if (dodgeCount === 5) {
                noBtn.textContent = 'Please? 💕';
            }
        }

        noBtn.addEventListener('mouseover', dodgeButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            dodgeButton();
        });
    </script>
</body>
</html>
